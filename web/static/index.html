<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screengrab Archive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23b5471b%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Screengrab Archive</a></h1>
    <form id="search" autocomplete="off">
      <input id="q" name="q" type="search" placeholder='Search dialogue…' autofocus>
      <div class="filters">
        <select id="speaker" name="speaker"><option value="">Any character</option></select>
        <select id="season" name="season"><option value="">Any season</option></select>
        <select id="episode" name="episode"><option value="">Any episode</option></select>
      </div>
    </form>
  </header>
  <main>
    <p id="status" class="status" aria-live="polite"></p>
    <section id="results" class="grid"></section>
    <button id="more" class="more" hidden>Load more</button>
  </main>

  <dialog id="detail">
    <button class="close" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </dialog>

  <template id="card">
    <article class="card">
      <button class="frame" type="button"><img loading="lazy" alt=""><span class="noimg">no screengrab yet</span></button>
      <div class="meta">
        <div class="speaker"></div>
        <blockquote class="text"></blockquote>
        <div class="where"><span class="code"></span> <span class="title"></span></div>
        <div class="when"></div>
        <div class="actions">
          <a class="open" target="_blank" rel="noopener">Open</a>
          <a class="download" download>Download</a>
          <button class="share" type="button">Share</button>
          <button class="ctx" type="button">Context</button>
        </div>
      </div>
    </article>
  </template>
  <script src="/static/app.js"></script>
</body>
</html>
