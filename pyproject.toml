[project]
name = "screengrab-archive"
version = "0.1.0"
description = "Self-hosted dialogue search with locally extracted screengrabs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10.1",
    "rapidfuzz>=3.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archive*", "web*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
web = ["static/*"]
scripts = ["demo_data/*"]
